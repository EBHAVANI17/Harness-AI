[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-aware-eval"
version = "0.1.0"
description = "Harness-Aware Plugin Evaluation Framework for company data MCP servers"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # MCP server
    "fastmcp>=0.4.0",
    # MCP Python SDK (client + types)
    "mcp>=1.0.0",
    # Gemini API
    "google-generativeai>=0.8.0",
    # Ollama client (optional — used by provider.py fallback)
    "ollama>=0.3.0",
    # HTTP client (MCP requests in provider.py + notebook_setup.py ping)
    "httpx>=0.27.0",
    # Config parsing
    "pyyaml>=6.0",
    # Environment loading
    "python-dotenv>=1.0.0",
    # GCP Cloud Storage integration
    "google-cloud-storage>=2.18.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "fastavro>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uv]
# uv-specific settings
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = ["data/", ".env", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
